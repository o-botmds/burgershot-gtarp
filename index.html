<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerShot - Sistema de Controle</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
        <!-- Substitua a parte do login no seu index.html -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>🍔 BurgerShot</h1>
        
            <!-- Form de Login -->
            <form id="loginForm">
                <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
        
            <button onclick="showAuthTab('register')">Criar Conta</button>
        
            <!-- Form de Registro -->
            <form id="registerForm" style="display: none;">
                <h2>Registro</h2>
                <input type="text" id="registerNome" placeholder="Nome" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Senha" required>
                <button type="submit">Solicitar Acesso</button>
                <button type="button" onclick="showAuthTab('login')">Voltar</button>
            </form>
        </div>
    </div>

    <!-- Aplicação Principal -->
    <div id="mainApp" class="main-app" style="display: none;">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🍔 BurgerShot</h2>
                <div class="user-badge" id="userBadge"></div>
                <button onclick="logout()" class="logout-btn">Sair</button>
            </div>
            
            <ul class="nav-menu">
                <li><button class="nav-btn active" data-section="dashboard">📊 Dashboard</button></li>
                <li><button class="nav-btn" data-section="metas">🎯 Metas</button></li>
                <li><button class="nav-btn" data-section="estoque">📦 Estoque</button></li>
                <li><button class="nav-btn" data-section="vendas">💰 Vendas</button></li>
                <li><button class="nav-btn" data-section="avisos">📢 Avisos</button></li>
                <li><button class="nav-btn" data-section="funcionarios">👥 Funcionários</button></li>
                <li><button class="nav-btn" data-section="expediente">⏰ Expediente</button></li>
                <li id="adminMenu" style="display: none;">
                    <button class="nav-btn" data-section="admin">⚙️ Administração</button>
                </li>
            </ul>
        </nav>

        <main class="content">
            <!-- Dashboard -->
            <section id="dashboard" class="section active">
                <h2>Dashboard</h2>
                <div id="dashboardContent"></div>
            </section>

            <!-- Metas -->
            <section id="metas" class="section">
                <h2>Controle de Metas</h2>
                <div id="metasContent"></div>
            </section>

            <!-- Estoque -->
            <section id="estoque" class="section">
                <h2>Controle de Estoque</h2>
                <div id="estoqueContent"></div>
            </section>

            <!-- Vendas -->
            <section id="vendas" class="section">
                <h2>Controle de Vendas</h2>
                <div id="vendasContent"></div>
            </section>

            <!-- Avisos -->
            <section id="avisos" class="section">
                <h2>Quadro de Avisos</h2>
                <div id="avisosContent"></div>
            </section>

            <!-- Funcionários -->
            <section id="funcionarios" class="section">
                <h2>Gestão de Funcionários</h2>
                <div id="funcionariosContent"></div>
            </section>

            <!-- Expediente -->
            <section id="expediente" class="section">
                <h2>Controle de Expediente</h2>
                <div id="expedienteContent"></div>
            </section>

            <!-- Administração -->
            <section id="admin" class="section">
                <h2>Painel Administrativo</h2>
                <div id="adminContent"></div>
            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/metas.js"></script>
    <script src="js/estoque.js"></script>
    <script src="js/vendas.js"></script>
    <script src="js/avisos.js"></script>
    <script src="js/funcionarios.js"></script>
    <script src="js/expediente.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
